name: Dynamic CI/CD Kubernetes Logistik

on:
  push:
    branches:
      - production
      - staging

env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
  # --- SSH MASTER CONFIG ---
  SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
  SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
  SSH_USER: ${{ secrets.PROD_SSH_USER }}
  SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
  # --- DYNAMIC PATHS ---
  GITHUB_REPO_ID: ${{ github.repository_id }}
  BASE_PATH: "/home/server/APP/HNDGROUP/LOGISTIK"
  APP_YAML_PATH: "kubernetes/${{ github.ref_name }}/03-app.yaml"
  NAMESPACE: "hndgroup-logistik"
  DEPLOYMENT_NAME: "logistik-app"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login ke Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_TOKEN }}

      - name: Build dan Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ github.ref_name }}.Dockerfile
          push: true
          tags: ${{ env.DOCKER_USERNAME }}/${{ env.GITHUB_REPO_ID }}:${{ github.ref_name }}-${{ github.sha }}

  deploy-to-kubernetes:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Prepare Server Directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            mkdir -p ${{ env.BASE_PATH }}
            rm -f ${{ env.BASE_PATH }}/*.yaml

      - name: Update Image Tag in Manifest
        run: |
          sed -i "s|image: ${{ env.DOCKER_USERNAME }}/${{ env.GITHUB_REPO_ID }}:.*|image: ${{ env.DOCKER_USERNAME }}/${{ env.GITHUB_REPO_ID }}:${{ github.ref_name }}-${{ github.sha }}|g" ${{ env.APP_YAML_PATH }}

      - name: Copy Manifests to Master
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          source: "kubernetes/${{ github.ref_name }}/*.yaml"
          target: ${{ env.BASE_PATH }}
          strip_components: 2
          overwrite: true

      - name: Execute Deployment & Artisan Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          port: ${{ env.SSH_PORT }}
          script: |
            cd ${{ env.BASE_PATH }}

            # 1. Apply all manifests in the branch folder
            kubectl apply -f .

            # 2. Tunggu proses rollout selesai agar pod baru benar-benar running
            echo "Menunggu pod baru ${{ env.DEPLOYMENT_NAME }} siap..."
            kubectl rollout status deployment/${{ env.DEPLOYMENT_NAME }} -n ${{ env.NAMESPACE }} --timeout=150s

            # 3. Optimasi Laravel (Clear Cache, Config, Route)
            echo "Running Laravel optimization..."
            kubectl exec -n ${{ env.NAMESPACE }} deployment/${{ env.DEPLOYMENT_NAME }} -- php artisan optimize:clear

            echo "Deployment ke branch ${{ github.ref_name }} Berhasil!"
