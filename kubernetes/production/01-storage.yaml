apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logistik-postgres-pvc
  namespace: hndgroup-logistik
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: logistik-storage-pvc
  namespace: hndgroup-logistik
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
